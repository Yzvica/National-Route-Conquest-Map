<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>国道制覇マップ</title>
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <h1>国道制覇マップ</h1>
        <section id="level" class="level"></section>
        <div id="tabs" class="tabs" role="tablist">
          <button type="button" role="tab" data-kind="kokudo" aria-selected="true">国道</button>
          <button type="button" role="tab" data-kind="expressway" aria-selected="false">高速道路</button>
          <button type="button" role="tab" data-kind="prefroad" aria-selected="false">都道府県道</button>
          <button type="button" role="tab" data-view="logs" aria-selected="false">ログ</button>
        </div>
        <section id="pref-picker" class="pref-picker" hidden></section>
        <section class="actions">
          <label class="button">
            走行ログを読み込む
            <input id="file" type="file" accept=".csv,.gpx,text/csv" multiple hidden />
          </label>
          <button id="navi-open" type="button">🧭 ナビ・コース(Google マップに送る)</button>
          <p id="status" class="muted">gbowl の CSV か GPX を選ぶか、画面にドロップしてください(複数可)</p>
        </section>
        <section id="overall"></section>
        <section id="categories"></section>
        <section id="log-view" class="log-view" hidden></section>
        <section id="routes-section">
          <h2 id="routes-title">国道別</h2>
          <input id="route-filter" type="search" placeholder="番号で絞り込み(例: 1)" />
          <ol id="routes"></ol>
        </section>
        <section class="actions">
          <button id="export" type="button">記録を書き出す</button>
          <label class="button secondary">
            記録を読み込む
            <input id="import" type="file" accept=".json" hidden />
          </label>
          <button id="rematch" type="button" hidden>保存したログで判定し直す</button>
          <button id="reset" type="button" class="danger">記録を消す</button>
        </section>
      </aside>
      <section id="replay" class="replay" hidden></section>
      <main id="map"><button id="map-restore" type="button">一覧を表示</button></main>
      <section id="detail" hidden></section>
      <dialog id="game">
        <div class="game-head">
          <div id="game-tabs" class="tabs" role="tablist">
            <button type="button" role="tab" data-game="achievements">実績</button>
            <button type="button" role="tab" data-game="suggest">おすすめ</button>
            <button type="button" role="tab" data-game="review">振り返り</button>
            <button type="button" role="tab" data-game="prefs">都道府県</button>
          </div>
          <button id="game-close" type="button" aria-label="閉じる">×</button>
        </div>
        <div id="game-body"></div>
      </dialog>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
