# OSM から国道・高速道路・都道府県道のデータを作り直し、リリース "route-data" に
# routes.json / expressways.json / prefroads.tar.gz(都道府県ごとのファイルをまとめたもの)として置く。
# 各区間には都道府県を付け、地図の色分け用の都道府県の形 prefectures.json も置く。
# データは大きいのでリポジトリには入れない。Actions タブから手動で実行する。
name: 国道・高速道路・都道府県道のデータを更新

on:
  workflow_dispatch:
    inputs:
      source:
        description: "取得元(geofabrik: 日本全体のOSMファイルから抽出 / overpass: Overpass API)"
        type: choice
        options: [geofabrik, overpass]
        default: geofabrik
      target:
        description: "作り直すデータ(both: 全部 / kokudo: 国道だけ / expressway: 高速道路だけ / prefroad: 都道府県道だけ / old: 今の国道データに旧道を付け直すだけ / pref: 今のデータに都道府県を付けるだけ。geofabrik のとき)"
        type: choice
        options: [both, kokudo, expressway, prefroad, old, pref]
        default: both
      detail:
        description: "確認用: 旧道を一覧でログに出す国道番号(例: 1 2)/ 都道府県道で扱いをログに出す名前(例: 津久井道)。空欄なら出さない"
        required: false
        default: ""
      upload:
        description: "作ったデータをリリースに置く(外すと作るだけで、ログで確認する)"
        type: boolean
        default: true
      refs:
        description: "overpass のときの対象国道番号(空欄なら全部。例: 1 20 246)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 都道府県道は Wikipedia の「〇〇県の県道一覧」で、番号や場所が合わない道(市町村道など)を除く
      - name: Wikipedia から都道府県道の一覧を取得
        if: inputs.source != 'overpass' && (inputs.target == 'both' || inputs.target == 'prefroad')
        continue-on-error: true
        run: python3 scripts/fetch_wiki_prefroads.py --out wiki_prefroads.json --raw-dir wiki-raw --sample
      - name: 取得した一覧を確認用に置く
        if: inputs.source != 'overpass' && (inputs.target == 'both' || inputs.target == 'prefroad')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wiki-prefroads
          path: |
            wiki_prefroads.json
            wiki-raw
          retention-days: 14

      # 日本全体の OSM ファイル(約2.4GB)は、同じ日(UTC)に2回目以降の実行ではキャッシュから使う。
      # Geofabrik は1日1回更新なので、日付が変わったら取り直す
      - name: 今日の日付
        id: day
        if: inputs.source != 'overpass'
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: 今日取得した日本の OSM ファイルがあれば使う
        id: osm-cache
        if: inputs.source != 'overpass'
        uses: actions/cache/restore@v4
        with:
          path: japan.osm.pbf
          key: japan-osm-${{ steps.day.outputs.day }}

      - name: Geofabrik から日本の OSM データを取得
        if: inputs.source != 'overpass'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install osmium shapely
          if [ -f japan.osm.pbf ]; then
            echo "今日取得した OSM ファイルをキャッシュから使います"
            osmium fileinfo -g header.option.osmosis_replication_timestamp japan.osm.pbf || true
          else
            bash scripts/download_japan.sh japan.osm.pbf
          fi

      - name: 日本の OSM ファイルをキャッシュに置く(同じ日の次の実行で使う)
        if: inputs.source != 'overpass' && steps.osm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: japan.osm.pbf
          key: japan-osm-${{ steps.day.outputs.day }}

      - name: 日本の OSM データから抽出して作る
        if: inputs.source != 'overpass'
        env:
          TARGET: ${{ inputs.target }}
          OLD_ROADS_DETAIL: ${{ inputs.detail }}
          PREFROAD_DETAIL: ${{ inputs.detail }}
          GH_TOKEN: ${{ github.token }}
        run: |
          osmium tags-filter japan.osm.pbf r/network=JP:national -o kokudo.osm.pbf
          osmium tags-filter japan.osm.pbf w/highway=motorway,motorway_link,trunk_link w/motorroad=yes w/toll=yes -o expressway.osm.pbf
          osmium tags-filter japan.osm.pbf r/admin_level=4 -o pref.osm.pbf
          if [ "$TARGET" = both ] || [ "$TARGET" = prefroad ]; then
            osmium tags-filter japan.osm.pbf "r/network=JP:prefectural*" w/highway=primary,secondary,tertiary -o prefroad.osm.pbf
          fi
          if [ "$TARGET" = both ] || [ "$TARGET" = kokudo ] || [ "$TARGET" = old ]; then
            osmium tags-filter japan.osm.pbf w/highway -o hw.osm.pbf
          fi
          # japan.osm.pbf はキャッシュに置くので消さない
          if [ "$TARGET" = both ] || [ "$TARGET" = kokudo ]; then
            python3 scripts/extract_pbf.py kokudo.osm.pbf raw.json
            python3 scripts/build_routes.py --input raw.json --out routes.json
          fi
          # 旧道(国道でなくなった旧ルート)を国道データに加える
          if [ -f hw.osm.pbf ]; then
            [ -f routes.json ] || gh release download route-data -p routes.json
            python3 scripts/build_old_roads.py find kokudo.osm.pbf hw.osm.pbf old-ids.txt
            osmium getid -r hw.osm.pbf -i old-ids.txt -o old.osm.pbf
            python3 scripts/build_old_roads.py add old-ids.txt.json old.osm.pbf routes.json
            rm hw.osm.pbf
          fi
          if [ "$TARGET" = both ] || [ "$TARGET" = expressway ]; then
            python3 scripts/build_expressways.py expressway.osm.pbf --out expressways.json
          fi
          # 作り直さなかったほうも、今リリースにあるものに都道府県を付け直す
          for f in routes.json expressways.json; do
            [ -f "$f" ] || gh release download route-data -p "$f" || echo "$f はまだリリースにありません"
          done
          files=()
          for f in routes.json expressways.json; do [ -f "$f" ] && files+=("$f"); done
          gh release download route-data -p prefectures.json -O prefectures-prev.json || echo "前回の prefectures.json はありません"
          # 都道府県道は都道府県ごとのファイルにして、1つにまとめる(アプリは選んだ都道府県だけ読む)
          if [ -f prefroad.osm.pbf ]; then
            python3 scripts/build_pref_roads.py prefroad.osm.pbf kokudo.osm.pbf pref.osm.pbf --fallback prefectures-prev.json --out-dir prefroads
            tar -czf prefroads.tar.gz prefroads
          fi
          python3 scripts/add_prefectures.py pref.osm.pbf "${files[@]}" --out prefectures.json --fallback prefectures-prev.json

      - name: Overpass API から取得して変換
        if: inputs.source == 'overpass'
        env:
          REFS: ${{ inputs.refs }}
        run: |
          args=()
          for r in $REFS; do args+=(--ref "$r"); done
          python3 scripts/build_routes.py "${args[@]}" --out routes.json

      - name: リリースに置く
        if: inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh routes.json expressways.json prefectures.json prefroads.tar.gz || true
          gh release view route-data >/dev/null 2>&1 || \
            gh release create route-data --title "国道データ" --notes "build_routes.py で生成した国道データ"
          # 作ったものだけ置く(高速道路・都道府県道・都道府県は Geofabrik から作ったときだけできる)
          for f in routes.json expressways.json prefectures.json prefroads.tar.gz; do
            if [ -f "$f" ]; then gh release upload route-data "$f" --clobber; fi
          done
